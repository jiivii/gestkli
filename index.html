<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sinestesya · Salud integral</title>
    <meta
      name="description"
      content="Sinestesya Salud Integral: gestión clínica y administrativa para psicología, fisioterapia, logopedia y nutrición."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3f6f5b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sinestesya" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />

    <!-- Tailwind CDN + tipografía -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              display: ['Fraunces', 'Georgia', 'serif'],
            },
            colors: {
              // Psicología · amarillo
              psy: {
                50: '#fdf9e9',
                100: '#faf0c8',
                200: '#f3df92',
                300: '#e9c95a',
                400: '#dbae30',
                500: '#c9a227',
                600: '#a8811d',
                700: '#856417',
                800: '#6f5319',
                900: '#5f471a',
              },
              // Fisioterapia · verde
              fisio: {
                50: '#eef7f2',
                100: '#d7eee0',
                200: '#b1dcc4',
                300: '#82c2a2',
                400: '#57a483',
                500: '#4f8a70',
                600: '#3f6f5b',
                700: '#35594b',
                800: '#2e483e',
                900: '#283d35',
              },
              // Logopedia · azul
              logo: {
                50: '#eef5fb',
                100: '#d9e9f7',
                200: '#b9d5ee',
                300: '#8bb9e1',
                400: '#5c97cf',
                500: '#4a7fb5',
                600: '#3e6794',
                700: '#365578',
                800: '#314864',
                900: '#2c3d53',
              },
              // Nutrición · naranja
              nutri: {
                50: '#fdf2ea',
                100: '#fbe1cc',
                200: '#f6c29c',

                400: '#e77f42',
                500: '#d9824b',
                600: '#b95f2f',
                700: '#954b29',
                800: '#783f26',
                900: '#623621',

              paper: '#f7f5f0',
            },
            boxShadow: {
              soft: '0 1px 2px rgba(41, 37, 36, 0.04)',
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        background-color: #f7f5f0;
        -webkit-font-smoothing: antialiased;
      }
      .font-display {
        font-family: 'Fraunces', Georgia, serif;
        font-optical-sizing: auto;
      }
      ::-webkit-scrollbar { width: 7px; height: 7px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #a8a29e; }
      ::selection { background: #d7eee0; color: #283d35; }
      :focus-visible { outline: 2px solid #4f8a70; outline-offset: 2px; }
      @media print {
        body { background: #fff; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function (err) {
            console.warn('[SW] No se pudo registrar:', err);
          });
        });
      }
    </script>
  </body>
</html>
